<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>Forum Command Center Banner</title>
<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    width: 1200px;
    height: 360px;
    margin: 0;
    overflow: hidden;
  }

  body {
    position: relative;
    display: grid;
    place-items: center;
    color: #f2f5f7;
    background:
      radial-gradient(circle at 18% 18%, rgba(92, 118, 143, 0.24), transparent 34%),
      radial-gradient(circle at 86% 82%, rgba(92, 118, 143, 0.13), transparent 30%),
      linear-gradient(135deg, #171a1e 0%, #0e1013 52%, #171b20 100%);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.22;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
    background-size: 30px 30px;
    mask-image: linear-gradient(90deg, transparent, black 20%, black 80%, transparent);
  }

  body::after {
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(92, 118, 143, 0.3);
    box-shadow:
      inset 0 0 70px rgba(0, 0, 0, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.018);
    pointer-events: none;
  }

  .banner {
    position: relative;
    z-index: 1;
    width: 1060px;
    display: grid;
    grid-template-columns: 350px 1px 1fr;
    align-items: center;
    gap: 54px;
  }

  .logo-wrap {
    display: grid;
    place-items: center;
    min-height: 190px;
  }

  .logo {
    width: 340px;
    height: auto;
    filter: drop-shadow(0 14px 25px rgba(0, 0, 0, 0.34));
  }

  .rule {
    width: 1px;
    height: 180px;
    background: linear-gradient(
      to bottom,
      transparent,
      rgba(92, 118, 143, 0.72) 22%,
      rgba(92, 118, 143, 0.72) 78%,
      transparent
    );
  }

  .copy {
    padding-bottom: 3px;
  }

  .eyebrow {
    margin: 0 0 13px;
    color: #8fa6bb;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    max-width: 590px;
    font-size: 58px;
    line-height: 0.98;
    letter-spacing: -0.045em;
    font-weight: 760;
  }

  .tagline {
    margin: 21px 0 0;
    max-width: 600px;
    color: #b8c0c8;
    font-size: 21px;
    line-height: 1.45;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  .accent {
    color: #7894ad;
  }
</style>
</head>
<body>
  <main class="banner" aria-label="Forum Command Center">
    <div class="logo-wrap">
      <svg class="logo" viewBox="10 9 106 45" role="img" aria-label="FCC logo">
        <g fill="#5C768F">
          <path d="M10 20 21 10h22l-5 10H21v6h15l-5 10H21v17H10Z"/>
          <path d="M79 16l-7 7c-2.9-2.8-6.7-4-10.5-4-6.6 0-11 5.2-11 12.5s4.4 12.5 11 12.5c3.8 0 7.6-1.2 10.5-4l7 7c-4.7 4.6-10.8 7-17.5 7C49 54 40 44.4 40 31.5S49 9 61.5 9C68.2 9 74.3 11.4 79 16Z"/>
          <path d="M116 16l-7 7c-2.9-2.8-6.7-4-10.5-4-6.6 0-11 5.2-11 12.5S91.9 44 98.5 44c3.8 0 7.6-1.2 10.5-4l7 7c-4.7 4.6-10.8 7-17.5 7C86 54 77 44.4 77 31.5S86 9 98.5 9c6.7 0 12.8 2.4 17.5 7Z"/>
        </g>
      </svg>
    </div>
    <div class="rule" aria-hidden="true"></div>
    <div class="copy">
      <p class="eyebrow">A clearer way through Torn's forums</p>
      <h1>Forum Command <span class="accent">Center</span></h1>
      <p class="tagline">Follow what matters. Catch up quickly. Keep every thread in its place.</p>
    </div>
  </main>
</body>
</html>
